[package]
name = "topak-slm-occupant"
version = "0.1.0"
edition = "2021"
publish = false
description = "The trained SLM as a compiled occupant: one Build round over the launcher's channel, inference inside (ADR-0036 §3, §4)"

# Not a member of mechanism/'s workspace, and not part of the reference.
[workspace]

[[bin]]
name = "occupant"
path = "src/main.rs"

[dependencies]
matrixmultiply = "0.3"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The same release as the Python binding the run was tokenized with (slm/serve/requirements.in), built with
# the pure-Rust regex engine so the binary links statically and the image needs nothing else.
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
