workflow: { file: ../2-workflows/recon-sectors.mesh.json, kind: mesh, sha256: 0d1f5b87676dcbbfcb138df1a248c65612b480ad2488cf5893c0cdcd5a1233fd }
observer_placement: other_vehicle    # ⟨Q9⟩ Declared for this mission, and the ring is in the mesh
seating:
  vehicle_class: fixed-wing-group-2
  safe_state: "on the ground, engine stopped, at a recovery site"
  safe_state_bound_ticks: 120        # Builder's obligation, not provable here (A-0068-4)
  hold: { behaviour: loiter, radius_m: 400, altitude: current }   # ⟨Q14⟩ Governor's, when an extent ends
  terminal:                          # Selected by the first rule that matches the governor's measured facts
    - { when: "nav_integrity != ok", do: stop, how: "controlled descent where it stands" }
    - { when: "fuel_pct < 15", do: land, site: nearest_alternate }
    - { when: otherwise, do: return, route: rtb-by-sector }
  recovery:
    primary: { id: R1, e: 0, n: 0 }
    alternates:
      - { id: ALT-NORTH, e: 15000, n: 22000 }
      - { id: ALT-SOUTH, e: 15000, n: -22000 }
    routes:
      rtb-by-sector:
        A: [{ e: 21000, n: 18000 }, { e: 0, n: 0 }]
        B: [{ e: 21000, n: 0 }, { e: 0, n: 0 }]
        C: [{ e: 21000, n: -18000 }, { e: 0, n: 0 }]
runtime:
  transport: { primary: "802.11s MANET, 5 GHz", fallback: "UHF narrowband mesh" }
  policy: { engine: wasm, sidecar: none }
  pbft: { view_change_timeout_ms: 6000, round_p99_ms_placeholder: 2500 }
  watchdog:
    overdue_grace_ms: 10000          # See README: ADR-0064 §5 read literally leaves no room for a round
  lease_margin_ms: 500
  drain_ticks_after_expiry: 120      # Replicas stay up to seal and hand up the record. Grants nothing
