# Charter of plane ap1, the autonomous plane: seven governors, no person, one intent.
# Voted at ib1 in the mission tally (tally.msn-0001.yaml), and it IS the first intent: ADR-0060 §2, and
# the proposal's §3.2, "an intent is a charter for one round". The schema is closed.
#
# The 24 hours are the expiry below. T_tick is 30 s, so 2880 periods is 24 hours. The field says tick
# 2879 because PlaneClock's NoGrantPastExpiry bounds a grant before (expiry + 1) · T_tick, so 2879 keeps
# every grant inside 24 hours. The count starts when the charter is applied ⟨Q13⟩, and not at the vote.
