# Regenerate the diagrams from the tree and fail if the committed files differ. Adapted from gov-tla's diagrams.yml
# (at gov-tla commit ba9a1c2), itself adapted from riemann-diagrams' posters.yml.
#
# The generators run under the family's pinned interpreter, Python 3.9 (diagrams/README.md: sum() over floats changed
# in 3.12, and with it the coordinates). Many diagrams read results files, records and specs at build time; B11 and
# H9 read theirs with git at PIN_G12 (diagrams/topak/src/lib.py), so the checkout has the full history. A diagram
# prints WARNING for an overlap and ERROR for a module that does not load, and a read that fails raises; any of these
# fails the job. The byte comparison then says whether the committed SVGs are the ones the tree produces: a change
# elsewhere in the corpus that a diagram reads fails here until the diagram is amended or its pin says otherwise.
#
# TOPAK's diagrams carry no links, so gov-tla's link check has no counterpart here. The one diagram outside the
# family, g1-to-bootstrap-2026.09.18.svg, is not regenerated: its generator writes to a path outside the tree.
#
# release.yml calls this on a tag before it publishes.
name: diagrams

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The repository allows GitHub-owned actions only, so the pinned interpreter comes from setup-python, not uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Regenerate under Python 3.9
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version; print(sys.version)'
          python diagrams/gen-topak-family.py | tee gen.log
          if grep -E '^\s*(WARNING|ERROR)' gen.log; then
            echo "::error::diagrams: the generator reported the lines above"
            exit 1
          fi
      - name: The committed diagrams are the ones the tree produces
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- diagrams/topak)
          if [ -n "$changed" ]; then
            echo "$changed"
            git --no-pager diff --stat -- diagrams/topak
            echo "::error::diagrams: regenerating changed the files above; regenerate under Python 3.9 and commit them, or amend the diagram"
            exit 1
          fi
