# Regenerates evidence and compares it with what is committed, for the suites a change touches (tools/ci-plan.sh):
#   tlc        every module in spec/modules.tsv of the tier, regenerated and compared (tools/check-results.sh), one
#              job per module. Tier `pr` on push and pull request; `all` adds Mesh (about 70 minutes) on demand.
#   reference  cargo test in mechanism/. The corpus-pins drift test is skipped here and ratcheted in checks.yml.
#   lean       lake build in mechanism/lean, spec/lean and floor/lean, at the toolchain tools/LEAN-PIN names.
#   floor      floor/run-gates.py, ADR-0030 §5's gates, with cvc5 1.4.0 and its proofs checked by ethos.
# Results files are never written here: a fresh file that differs is uploaded for reading, and the committed file is
# regenerated by hand as a new dated file. ADR-0069 §10.2 (Proposed); adapted from f1-tla's results.yml.
# Not here, and why: TLAPS. The pinned prover (tools/TLAPS-PIN, arm64-darwin) is not what upstream serves, so a
# runner cannot rerun the proofs with it (ADR-0069 §6 G-3); checks.yml reports which proofs are stale.
name: results
on:
  push:
    branches: [main]
    paths: ["spec/**", "tools/**", "mechanism/**", "policies/**", "floor/**", ".github/workflows/results.yml"]
  pull_request:
    paths: ["spec/**", "tools/**", "mechanism/**", "policies/**", "floor/**", ".github/workflows/results.yml"]
  workflow_dispatch:
    inputs:
      tier:
        description: "TLC tier: pr, or all (adds Mesh, about 70 minutes)"
        type: choice
        options: [pr, all]
        default: pr
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tlc: ${{ steps.plan.outputs.tlc }}
      reference: ${{ steps.plan.outputs.reference }}
      lean: ${{ steps.plan.outputs.lean }}
      floor: ${{ steps.plan.outputs.floor }}
      modules: ${{ steps.matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        run: tools/ci-plan.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}" | tee -a "$GITHUB_OUTPUT"
      - id: matrix
        run: echo "modules=$(tools/check-results.sh --matrix '${{ inputs.tier || 'pr' }}')" | tee -a "$GITHUB_OUTPUT"

  tlc:
    needs: plan
    if: needs.plan.outputs.tlc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.module == 'Mesh' && 330 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Regenerate ${{ matrix.module }} and compare
        run: RESULTS_OUT="$RUNNER_TEMP/fresh" tools/check-results.sh "${{ matrix.module }}"
      - name: Keep the fresh results file
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-${{ matrix.module }}
          path: ${{ runner.temp }}/fresh/

  reference:
    needs: plan
    if: needs.plan.outputs.reference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mechanism/target
          key: cargo-${{ runner.os }}-${{ hashFiles('mechanism/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the scripted guest the contain tests launch (cargo test builds no other package's binaries)
        working-directory: mechanism
        run: cargo build --release -p topak-contain --bins
      - name: cargo test (the drift test is ratcheted in checks.yml)
        working-directory: mechanism
        run: cargo test --workspace --release --no-fail-fast -- --skip pinned_records_have_not_drifted

  lean:
    needs: plan
    if: needs.plan.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            mechanism/lean/.lake
            spec/lean/.lake
            floor/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('tools/LEAN-PIN', '**/lean/lake-manifest.json', '**/lean/lean-toolchain') }}
      - name: elan, at a pinned commit of its installer (v4.2.4)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/elan-init.sh" https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The toolchain is the pin's (on this platform; the pin's binary digests are arm64-darwin's)
        run: |
          tc=$(grep -E '^toolchain ' tools/LEAN-PIN | cut -d' ' -f2)
          for p in mechanism/lean spec/lean floor/lean; do echo "$p: $(cat $p/lean-toolchain)"; [ "$(cat $p/lean-toolchain)" = "$tc" ]; done
      - name: lake build mechanism/lean
        if: ${{ !cancelled() }}
        working-directory: mechanism/lean
        run: lake build
      - name: lake build spec/lean
        if: ${{ !cancelled() }}
        working-directory: spec/lean
        run: lake build
      - name: lake build floor/lean
        if: ${{ !cancelled() }}
        working-directory: floor/lean
        run: lake build

  floor:
    needs: plan
    if: needs.plan.outputs.floor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cedar
            tools/ethos-*
          key: floor-tools-${{ runner.os }}-cedar-4.13.0-${{ hashFiles('tools/install-ethos.sh') }}
      - name: cvc5 1.4.0, checked against the release's published digest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cvc5.zip" https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.0/cvc5-Linux-x86_64-static.zip
          echo "61d13483ec9c4e8d05c7f3d532225255b2183a0c03b161d37d942d1ba089ec6d  $RUNNER_TEMP/cvc5.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          echo "CVC5=$(find "$RUNNER_TEMP/cvc5" -type f -name cvc5 -perm -u+x | head -1)" >> "$GITHUB_ENV"
      - name: ethos, the pinned proof checker (tools/install-ethos.sh)
        run: |
          ls tools/ethos-*/bin/ethos 2>/dev/null || { sudo apt-get install -y -q cmake libgmp-dev && tools/install-ethos.sh; }
      - name: cedar 4.13.0 with symbolic analysis
        run: command -v cedar || cargo install cedar-policy-cli@4.13.0 --features analyze --locked
      - name: The floor gates
        run: python3 floor/run-gates.py "$RUNNER_TEMP/gates-results.txt"
      - name: Keep the gate results and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floor-gates
          path: ${{ runner.temp }}/gates-results.txt*
