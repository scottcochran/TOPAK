# Fast checks on every push to main and every pull request; no prover, no model checker, no Rust build.
# Gate evidence for ADR-0069 §10.2 (Proposed): during genesis it supports the custodian's ratification and promotes
# nothing (§10.3). Each step calls a repository script that runs the same by hand; this file only orders them.
#
# Strict, because each passes on main today: the TLC jar against tools/TLA-PIN; the proofs in step with the
# specifications (spec/proof-sync.sh; needs no prover); every manifest in manifests/index.tsv against its commit.
# Ratcheted, because each has findings that predate CI (tools/ratchet.py): the corpus pins the reference follows
# (mechanism/corpus-pins.sha256), the Lean results in step (tools/lean-sync.sh), the repository's path citations
# (tools/check-refs.py), and the record lint. A ratcheted step lists what stands in the job summary and fails only on
# what this change adds.
name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # verify-manifest.sh reads old commits; the ratchet checks out the base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Plan
        id: plan
        run: tools/ci-plan.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}" | tee -a "$GITHUB_OUTPUT"

      - name: The TLC jar matches its pin
        if: ${{ !cancelled() }}
        run: tools/check-pins.sh
      - name: The proofs are in step with the specifications
        if: ${{ !cancelled() }}
        run: spec/proof-sync.sh
      - name: Every manifest verifies against its commit
        if: ${{ !cancelled() }}
        run: tools/verify-manifest.sh --all

      - name: Corpus pins (ratchet)
        if: ${{ !cancelled() }}
        run: >
          tools/ratchet.py --base "${{ steps.plan.outputs.base }}" --name "Corpus pins the reference follows"
          --include ': FAILED$' -- shasum -a 256 -c mechanism/corpus-pins.sha256
      - name: Lean results in step (ratchet)
        if: ${{ !cancelled() }}
        run: >
          tools/ratchet.py --base "${{ steps.plan.outputs.base }}" --name "Lean results in step"
          --include 'STALE$|MISSING RESULTS|NOT STATED IN LEAN|OFF THE PIN|NOT THE PINNED KERNEL' -- tools/lean-sync.sh
      - name: Path citations (ratchet)
        if: ${{ !cancelled() }}
        run: >
          tools/ratchet.py --base "${{ steps.plan.outputs.base }}" --name "Path citations"
          --include '^  \S' --context '^\S.*:$' -- python3 tools/check-refs.py
      - name: Record lint (ratchet)
        if: ${{ !cancelled() }}
        run: >
          tools/ratchet.py --base "${{ steps.plan.outputs.base }}" --name "Record lint"
          --include '^  FAIL' --context '^ADR-[0-9]+:'
          -- bash -c 'python3 .claude/skills/drafting-records/scripts/record_lint.py decisions/ADR-*.md'
