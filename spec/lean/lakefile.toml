# The small TLA+ modules of spec/ re-encoded as transition systems in Lean 4, their invariants proved by
# induction on reachable states. No dependencies: core Lean only, no Mathlib.
name = "topak-spec"
defaultTargets = ["TopakSpec"]

[[lean_lib]]
name = "TopakSpec"

# The checker of the re-encodings against TLC's state graphs (graph-check.sh); not part of the library.
[[lean_exe]]
name = "graphcheck"
root = "GraphCheck"
