# The small TLA+ modules of spec/ re-encoded as transition systems in Lean 4, their invariants proved by
# induction on reachable states. No dependencies: core Lean only, no Mathlib.
name = "topak-spec"
defaultTargets = ["TopakSpec"]

[[lean_lib]]
name = "TopakSpec"

# The checkers of the re-encodings against TLC's state graphs; not part of the library. Each has its own script and
# results series: graphcheck for Seats and FloorComposition (graph-check.sh), graphcheck-emergency for Emergency and
# Emergency_live (graph-check-emergency.sh). Both import GraphCheckCore, the reading of a graph and the check, which
# is a library of its own because Lake builds an executable's imports only from a library.
[[lean_lib]]
name = "GraphCheckCore"

[[lean_exe]]
name = "graphcheck"
root = "GraphCheck"

[[lean_exe]]
name = "graphcheck-emergency"
root = "GraphCheckEmergency"
